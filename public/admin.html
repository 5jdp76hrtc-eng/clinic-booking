<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة الحجوزات</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-wrap { max-width: 960px; margin: 40px auto; padding: 0 20px; }
  .login-box { max-width: 380px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
  th, td { padding: 12px 14px; text-align: right; font-size: 14px; border-bottom: 1px solid var(--line); }
  th { background: var(--primary); color: #fff; }
  select.status { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .status-confirmed { color: var(--primary); font-weight: 600; }
  .status-cancelled { color: var(--danger); font-weight: 600; }
  .status-done { color: var(--ink-soft); font-weight: 600; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="admin-wrap" id="loginView">
  <div class="login-box">
    <h2 style="margin-bottom:16px">دخول لوحة الإدارة</h2>
    <div class="field">
      <label for="adminPass">كلمة المرور</label>
      <input type="password" id="adminPass">
    </div>
    <button class="btn btn-primary" style="width:100%" id="loginBtn">دخول</button>
    <div class="form-msg error" id="loginMsg"></div>
  </div>
</div>

<div class="admin-wrap" id="dashView" style="display:none">
  <div class="topbar">
    <h2>الحجوزات</h2>
    <button class="btn btn-outline" style="color:var(--primary); border-color:var(--primary)" id="logoutBtn">خروج</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>#</th><th>المريض</th><th>الهاتف</th><th>الخدمة</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th>
      </tr>
    </thead>
    <tbody id="bookingsBody"></tbody>
  </table>
</div>

<script src="js/admin.js"></script>
</body>
</html>
